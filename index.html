<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Mijn Thuisbar</title>
    <meta name="description" content="Voorraadbeheer, recepten en feestplanning voor je eigen thuisbar." />

    <!-- Linkvoorbeeld (WhatsApp/iMessage). Voor gedeelde menu's (?menu=)
         vult netlify/edge-functions/menu-og.js deze per feest in. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mijn Thuisbar" />
    <meta property="og:title" content="Mijn Thuisbar" />
    <meta property="og:description" content="Het cocktailmenu van vanavond" />
    <meta property="og:image" content="https://beautiful-pasca-793e77.netlify.app/og-menu.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://beautiful-pasca-793e77.netlify.app/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mijn Thuisbar" />
    <meta name="twitter:description" content="Het cocktailmenu van vanavond" />
    <meta name="twitter:image" content="https://beautiful-pasca-793e77.netlify.app/og-menu.png" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <meta name="theme-color" content="#1F3D36" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Thuisbar" />

    <!-- Inline (render-blocking-safe, geen netwerkverzoek) zodat de allereerste
         verf al de donkergroene splash-kleur toont in plaats van even de beige
         app-achtergrond te laten opflitsen voordat React heeft gemount. -->
    <style>
      html, body { background: #0E1917; }
    </style>
  </head>
  <body style="margin:0">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
